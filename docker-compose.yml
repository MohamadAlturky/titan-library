services:
  db:
    image: postgres:17-alpine
    container_name: titan_library_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: titan_library
      POSTGRES_USER: titan_user
      POSTGRES_PASSWORD: titan_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan_user -d titan_library"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: titan_library_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=titan_library;Username=titan_user;Password=titan_password;"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local