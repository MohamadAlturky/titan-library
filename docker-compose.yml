services:
  db:
    image: postgres:17-alpine
    container_name: titan_library_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: titan_library
      POSTGRES_USER: titan_user
      POSTGRES_PASSWORD: titan_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan_user -d titan_library"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./Titan.Library.Web
      dockerfile: Dockerfile
    container_name: titan_library_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  seq:
    image: datalust/seq:latest
    container_name: titan_library_seq
    restart: unless-stopped
    ports:
      - "5341:5341"
      - "8081:80"
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: "admin"

  redis:
    image: redis:7-alpine
    container_name: titan_library_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: titan_library_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=titan_library;Username=titan_user;Password=titan_password;"
      ConnectionStrings__RedisConnection: "redis:6379"
      Serilog__WriteTo__1__Name: Seq
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
    depends_on:
      db:
        condition: service_healthy
      seq:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local